name: Flutter CI

on:
  push:
    branches:
      - main

jobs:

  build-ios:
    runs-on: macos-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Apple Files
        env:
          IOS_KEY_BASE64: ${{ secrets.IOS_KEY_BASE64 }}
          IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
        run: |
          echo "$IOS_KEY_BASE64" | base64 --decode > ios.key
          echo "$IOS_CERT_BASE64" | base64 --decode > distribution.cer

      - name: Convert Certificate
        run: |
          openssl x509 -inform DER -in distribution.cer -out distribution.pem

          openssl pkcs12 -export \
            -out ios_certificate.p12 \
            -inkey ios.key \
            -in distribution.pem \
            -certpbe PBE-SHA1-3DES \
            -keypbe PBE-SHA1-3DES \
            -password pass:abc123

      - name: Decode Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > \
          ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Setup Keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          security default-keychain -s build.keychain

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          security import ios_certificate.p12 \
            -k build.keychain \
            -P "abc123" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          security find-identity -v -p codesigning

      - name: Configure iOS Signing
        run: |
          cd ios

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier com.rkandukuri.aijobsearch" \
            Runner/Info.plist

          sed -i '' \
            's/com.example.aiJobMobileClean/com.rkandukuri.aijobsearch/g' \
            Runner.xcodeproj/project.pbxproj

      - name: Build Unsigned iOS App
        run: flutter build ios --release --no-codesign

      - name: Archive App
        run: |
          cd ios

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            archive \
            DEVELOPMENT_TEAM=59MQFXV295 \
            PRODUCT_BUNDLE_IDENTIFIER=com.rkandukuri.aijobsearch \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="AIJobSearchProfile"

      - name: Export IPA
        run: |
          cd ios

          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/ipa/*.ipa

  build-android:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk